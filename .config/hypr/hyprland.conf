# ───────────────────────────────
# Hyprland minimal blur rice
# by SayanPal (sayanx64)
# ───────────────────────────────

# Monitor
monitor=,preferred,auto,1

# Environment Vars
env = GDK_SCALE,1
env = GDK_DPI_SCALE,0.90
env = QT_SCALE_FACTOR,0.90
env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# Autostart
exec-once = hyprpaper -c ~/.config/hypr/hyprpaper.conf
exec-once = waybar
exec-once = dunst
exec-once = nm-applet
exec-once = blueman-applet
exec-once = sh ~/.config/hypr/startup.sh

# Decoration & Blur
decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.85

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = false
    }
}

# General
general {
    gaps_in = 6
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)
}

# Layout 
master {
    mfact = 0.6
    new_on_top = true
}

# ─── Keybinds ──────────────────
bind = SUPER, RETURN, exec, kitty
bind = SUPER, D, exec, rofi -show drun
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, W, exec, pkill waybar && waybar

# Workspaces 1–9
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%s).png

# Media Keys 
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

# Brightness Keys 
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window Rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(Blueman-manager)$






plugin {
  touch_gestures {
    sensitivity = 1.5          # Increase if swipes feel sluggish
    workspace_swipe_fingers = 3
    workspace_swipe_edge = d   # Swipe up from bottom to change workspace
    long_press_delay = 400
    resize_on_border_long_press = true
    edge_margin = 10
  }
}


